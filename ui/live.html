<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reflex — correct it once</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0c1220;--panel:#131b2c;--raised:#182338;--border:#24304a;
  --text:#e7ecf3;--muted:#7c8aa0;--dim:#3d4a66;
  --code:#e8a33d;--weights:#9b6bff;--context:#4fd1c5;
  --fd:'Space Grotesk',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fd);
  height:100vh;display:flex;flex-direction:column}
.mono{font-family:var(--fm)}

header{padding:15px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;flex-shrink:0}
.brand{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13.5px;color:var(--muted)}
.sub b{color:#9fb0c6;font-weight:400}
.conn{margin-left:auto;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.live{background:var(--context)}.dot.busy{background:var(--code)}

#log{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;
  gap:16px;max-width:820px;width:100%;margin:0 auto}

.msg{display:flex;flex-direction:column;gap:5px;max-width:88%}
.msg .who{font-family:var(--fm);font-size:9.5px;letter-spacing:.15em;color:var(--muted)}
.msg .body{font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.msg.you{align-self:flex-end;align-items:flex-end}
.msg.you .body{background:var(--raised);padding:11px 14px;border-radius:10px 10px 2px 10px}
.msg.bot .body{color:#dbe3ee}

/* the routing moment — only appears when a correction is detected */
.route{border:1px solid var(--border);background:var(--panel);
  display:flex;flex-direction:column;overflow:hidden;align-self:stretch;
  animation:drop .35s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.route .top{padding:9px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);background:#0f1626}
.route .top .k{font-family:var(--fm);font-size:9.5px;letter-spacing:.15em;color:var(--code)}
.route .top .t{font-size:12.5px;color:var(--muted)}
.route .top .n{margin-left:auto;display:flex;gap:5px;align-items:center}
.rdot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.rdot.seen{background:var(--muted)}
.rdot.on{width:12px;height:12px;background:var(--weights);box-shadow:0 0 0 3px rgba(155,107,255,.2)}

.fork{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.opt{padding:11px 13px;background:var(--panel);display:flex;flex-direction:column;gap:4px;
  opacity:.33;transition:opacity .4s,background .4s}
.opt .n{font-family:var(--fm);font-size:10.5px;font-weight:600;letter-spacing:.13em}
.opt .d{font-size:11.5px;color:var(--muted);line-height:1.4}
.opt[data-l=code] .n{color:var(--code)}
.opt[data-l=weights] .n{color:var(--weights)}
.opt[data-l=context] .n{color:var(--context)}
.opt.win{opacity:1}
.opt.win[data-l=code]{background:#22190e}
.opt.win[data-l=weights]{background:#1a1730}
.opt.win[data-l=context]{background:#0f2420}
.opt.win .d{color:#c3cdda}
.route.pending .opt{opacity:.33}
.route .why{padding:10px 14px;font-size:12.5px;line-height:1.5;color:#9fb0c6;
  border-top:1px solid var(--border);background:#0f1626}
.route .why .mono{color:var(--muted);font-size:10px;letter-spacing:.13em;margin-right:8px}

.hint{align-self:center;font-size:12.5px;color:var(--muted);text-align:center;
  max-width:560px;line-height:1.6}
.try{background:none;border:none;color:var(--context);cursor:pointer;font:inherit;
  text-decoration:underline;padding:0}

form{padding:13px 24px;border-top:1px solid var(--border);background:#0a0f1b;
  display:flex;gap:9px;align-items:center;flex-shrink:0;max-width:820px;width:100%;
  margin:0 auto}
input{flex:1;padding:12px 14px;background:var(--bg);border:1px solid #2a3240;
  color:var(--text);font:inherit;font-size:14.5px;border-radius:6px}
input:focus{outline:none;border-color:var(--weights)}
button{padding:12px 16px;border-radius:6px;border:1px solid #2a3240;
  background:var(--raised);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
button.go{background:var(--weights);border-color:var(--weights);color:#0c1220;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.err{color:#e06c6c;font-size:12.5px;align-self:center}
@media(max-width:640px){.fork{grid-template-columns:1fr}.msg{max-width:96%}}
</style>
</head>
<body>

<header>
  <div class="brand">reflex</div>
  <div class="sub">Talk to the agent. <b>Correct it when it goes wrong — and watch where the correction goes.</b></div>
  <div class="conn"><span class="dot" id="conn"></span><span class="mono" style="font-size:10px;color:var(--muted)" id="connlbl">connecting</span></div>
</header>

<div id="log">
  <div class="hint">
    Ask it for something, then tell it off when it slips.<br>
    Try
    <button class="try" data-t="Add a retry to the upload function.">ask for a change</button>,
    then
    <button class="try" data-t="You keep saying it's done without running the tests. Run the suite before telling me a change is ready.">correct it</button>.
  </div>
</div>

<form id="bar">
  <input id="msg" placeholder="Say something to the agent…" autocomplete="off" required>
  <button class="go" id="go" type="submit">Send</button>
  <button id="reset" type="button" title="Restore the starting state">Reset</button>
</form>

<script src="live.js"></script>
</body>
</html>
